 should be noted that while both male and female African Bush Elephants have tusks, other species (like the Asian elephant) only have males with tusks, with the females only having small "tushes". Their thick skin is only superficially pigmented and the intensity of the melanin layer varies from a dense black to pale grey, brown or, in rare cases, depigmented pink.

Bush elephants are mainly active in the morning, afternoon, evening and at night, resting during noon heat in the shade of bushes or trees. They sleep in 1-2 rest periods (1-2 hours) each night, more often standing up than lying down.

They are social animals and adopt matriarchal societies where the central social unit is the mother and her offspring. Finding food, each other and travelling is easier done in groups but even here the nuclear family is split by the time there are 10 daughters and grandparents, with young males leaving the family between the ages of 10 and 15 to live solitary lives or form loose "bachelor herds". Female elephants are frequent "talkers", using rumbles, growls, roars, snorts and squeals to convey a variety of signals, conditions and emotions.

Eating up to 5% of their body weight in food (up to 300kg) in a 24-hour period, their diets consist mainly of grass and browse. Trees are felled to obtain out-of-reach fruits; however, this felling is often done by young or solitary males and generally attracts families or other solitary males, so obtaining these fruits may not be the only reason for such behaviour.`,images:["./images/Animals/African Bush Elephant/DSC_4018.webp","./images/Animals/African Bush Elephant/DSC_4198.webp","./images/Animals/African Bush Elephant/DSC_4642.webp","./images/Animals/African Bush Elephant/DSC_4908.webp","./images/Animals/African Bush Elephant/DSC_4938.webp"],locations:["TANZANIA","","","",""],funFact:"African elephants boast (or suffer from) the longest gestation period of any mammal, a total of 22 months."},{id:2,name:"African Leopard",scientificName:"Panthera pardus",foundIn:"Sub-Saharan Africa",description:`The African leopard is a big cat with a well-balanced, muscular build, broad head and relatively short limbs. With nine subspecies, the leopard is the smallest of the five big cats in the Panthera genus, but is one of the most adaptable. They are agile climbers and able to tackle prey several times their own body weight.

The hunting strategy of the leopard is one of stealth and ambush; unlike cheetahs, they are not built for pursuit, so they rely on a quick, powerful strike to disable prey (which ranges from dung beetles to adult male elands weighing up to 900kg). This hunt is often done in solitude, with the leopard being a solitary animal and the mother working alone to feed and protect her cubs. However, males and females can stay together for a few days after mating, sharing each other's food and company.

A day in the life of an African leopard consists of a lot of resting (as can be seen in the images), up to 80% in fact. It is when the sun goes down and the temperature drops that the leopard starts patrolling its territory and hunting for food; they are largely nocturnal predators.

Unfortunately, five out of the nine subspecies of leopards are categorised as Endangered or Critically Endangered, and the Amur leopards are close to extinction. In contrast to this, the leopards of sub-Saharan Africa are thriving, but they face environmental threats of their own. With such high numbers of animals, contact with humans is inevitable, so there is growing tension between leopard and human populations.`,images:["./images/Animals/African Leopard/DSC_6741.webp","./images/Animals/African Leopard/DSC_6752.webp","./images/Animals/African Leopard/DSC_6756.webp"],locations:["TANZANIA","",""],funFact:"Leopards are spotted through and through. If you were to shave one, you would find that their skin is covered in spots."},{id:3,name:"African Lion",scientificName:"Panthera leo",foundIn:"East/Southern/West & Central Africa",description:`With a powerful and broad head, muzzle of medium length, ears short and round, thick legs, long tail, and a mane (males only), the lion is Africa's most notorious predator. They boast free-floating shoulder blades, switchblade-like claws that can be unsheathed from their paws and huge jaw muscles that allow them to clamp onto their prey and suffocate it.

Often inhabiting expansive environments with their prey travelling in large groups, in order to survive, lions have learnt to develop a co-operative social system, and are therefore the most social of all the big cats. Lions live in prides consisting of several lionesses, usually sisters, and one or more outsider males. The males defend the territory, while the females work together to hunt and raise the cubs. Males can often be unpredictable and aggressive, so for the first six to eight weeks, a lioness cares for her cubs alone. After this period, the cubs are introduced to the rest of the pride, where they will be cared for by all the lionesses.

The hunting done by lionesses often involves stalking their prey. Because they have limited stamina, they have to remain hidden, flanking their target to get as close as possible before the attack begins. Once it has begun, the lionesses will charge at their prey, grabbing the target around the neck with their immensely strong jaws, breaking its spine or crushing its trachea in a vice-like grip that can be held for up to ten minutes.`,images:["./images/Animals/African Lion/DSC_6171.webp","./images/Animals/African Lion/DSC_6073.webp","./images/Animals/African Lion/DSC_6135.webp","./images/Animals/African Lion/DSC_6185.webp","./images/Animals/African Lion/DSC_6189.webp","./images/Animals/African Lion/DSC_6264.webp"],locations:["TANZANIA","TANZANIA","TANZANIA","TANZANIA","TANZANIA","TANZANIA"],funFact:"The male African lion's roar is the loudest of any big cat species, and can be heard from up to 8km away."},{id:4,name:"Alpine Chough",scientificName:"Pyrrhocorax graculus",foundIn:"High mountain regions across southern Europe, North africa, and Asia",description:`The Alpine Chough is a bird in the crow family, one of only two species in the genus Pyrrhocorax. The bird has glossy black plumage, a yellow beak, red legs and a distinctive, high-pitched call. Due to their high-altitude habitat, their eggs have adapted to the thin atmosphere and have improved oxygen take-up and reduced water loss.

These birds are highly social, often being seen in large flocks performing acrobatic aerial displays, especially around ski lifts where they have learned to take advantage of the updrafts to soar effortlessly on the thermals. They are known for their playful nature, frequently engaging in aerial games and sliding down snow slopes on their backs. They are also quite intelligent and have been observed using tools, such as twigs, to probe tree bark for insects.

Alpine Choughs form monogamous pairs that often bond for life. Breeding season typically begins in May, with courtship displays involving aerial acrobatics and mutual preening. Nests are built in sheltered locations such as cliff crevices, abandoned buildings, or even old mine shafts, often high above the ground. Both parents participate in incubating the eggs and caring for the chicks, which fledge after about 30 days.

The diet of Alpine Choughs is one that changes seasonally. In the summer, they forage for insects, spiders, and small invertebrates, whereas in the winter where these foods are rare, they switch to berries, seeds, and small rodents.`,images:["./images/Animals/Alpine Chough/20240419_154343(0).webp","./images/Animals/Alpine Chough/20240419_154344(1).webp","./images/Animals/Alpine Chough/20240419_154344.webp"],locations:["CHAMONIX","CHAMONIX","CHAMONIX"],funFact:"They are one of the highest nesting birds in the world, nesting at heights of up to 6,500m. They have even been observed following mountaineers ascending Mount Everest."},{id:5,name:"Banded Mongoose",scientificName:"Mungos mungo",foundIn:"East/South and parts of Central Africa",description:`Banded mongooses have a coarse, brownish-grey coat, dark feet, and dark bands across their backs. These bands are found between the mid-back and base of the tail and are a distinguishing feature of this mongoose species. They are opportunistic feeders, with their diet consisting mostly of insects and a variety of other invertebrates. They also occasionally eat small mammals, reptiles, birds, eggs, and fruit.

They are diurnal, travelling in packs of 15-20 individuals led by a dominant female. They communicate within the pack using a series of low calls, unless danger is sensed, in which case they emit a high-pitched alarm call. When a predator is detected, the pack will gather and move together to scare it away, a phenomenon known as 'bunching'. They vigorously defend their territory and have even been seen chasing and lunging at predators, forcing them to drop a captured mongoose.

Banded mongooses breed within their packs; females are ready to breed at 9-12 months old, while males reach sexual maturity at 4 months old. Each pack can produce up to four litters a year, but in areas with pronounced seasonal weather changes, they breed only during the rainy season when food is more abundant.

Raising young among the banded mongoose society is a unique experience. Rather than the mother bearing all the responsibility, other adult and sub-adult members of the pack will pair up with individual pups, dedicating themselves to protecting, carrying, and teaching their specific pup how to forage. This 'buddy' system showcases a highly cooperative social structure that ensures the survival of the next generation.`,images:["./images/Animals/Banded Mongoose/DSC_6494.webp","./images/Animals/Banded Mongoose/DSC_6291.webp","./images/Animals/Banded Mongoose/DSC_6488.webp","./images/Animals/Banded Mongoose/DSC_6492.webp","./images/Animals/Banded Mongoose/DSC_6493.webp","./images/Animals/Banded Mongoose/DSC_6500.webp","./images/Animals/Banded Mongoose/DSC_6501.webp","./images/Animals/Banded Mongoose/DSC_6502.webp"],locations:["TANZANIA","TANZANIA","TANZANIA","TANZANIA","TANZANIA","TANZANIA","",""],funFact:"Mongooses are meticulous groomers, engaging in mutual grooming sessions after a long day of foraging that keeps them free of parasites and strengthens social bonds within their packs."},{id:6,name:"Black-chested Snake Eagle",scientificName:"Circaetus pectoralis",foundIn:"Eastern/Southern and Parts of Central Africa",description:`A medium-sized, mostly brown eagle with yellow eyes and an unspotted white belly. The diet of these birds consists mainly of snakes, as their name suggests, including some particularly venomous ones (also some lizards, frogs and small mammals). Once the bird catches and kills a snake, it will generally swallow it whole. In order to maximise its prey intake, the eagle will employ a variety of hunting techniques, such as soaring flight, hovering, and perching. It has even learned to take advantage of grassfires, using them to flush out snakes hiding in the grass, too distracted to notice the predator.

The Black-chested Snake Eagle, like most other eagles, builds its own nest. Using sticks and twigs to construct a small, platform nest in relatively small trees, such as Acacias. Once the nest has been completed, the female will lay eggs and spend the following ~50 days incubating them, occasionally turning them to ensure they stay at just the right temperature so that the embryo can develop correctly. During this time, the male will work to hunt prey and feed himself and the female. When young hatch, they grow fast and leave the nest about 3 months later.
